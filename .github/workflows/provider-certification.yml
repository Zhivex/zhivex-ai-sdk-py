name: Tier-1 provider certification

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Tier-1 target to certify from the wheel built in this checkout
        required: true
        type: choice
        options:
          - openai
          - anthropic
          - azure-openai
          - gemini
          - vertex
          - qwen
          - kimi
          - deepseek
          - meta
          - vllm
      profile:
        description: full runs the reviewed operation set; cheap runs one generation call
        required: false
        default: full
        type: choice
        options:
          - full
          - cheap

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: provider-certification
    env:
      ZHIVEX_SMOKE_USE_INSTALLED: "1"
      ZHIVEX_SMOKE_STRICT: "1"
      ZHIVEX_SMOKE_AGENTS: "1"
      ZHIVEX_SMOKE_PORTABLE_CERTIFICATION: "1"
      ZHIVEX_SMOKE_META_CERTIFICATION: "1"
      ZHIVEX_SMOKE_SANITIZED_DIAGNOSTICS: "1"
      ZHIVEX_SMOKE_PROVIDERS: ${{ inputs.provider }}
      ZHIVEX_SMOKE_PROFILE: ${{ inputs.profile }}
      ZHIVEX_SMOKE_OPENAI_MODEL: gpt-5.6-luna
      ZHIVEX_SMOKE_ANTHROPIC_MODEL: claude-fable-5-1
      ZHIVEX_SMOKE_AZURE_OPENAI_MODEL: ${{ vars.ZHIVEX_CERT_AZURE_OPENAI_MODEL }}
      ZHIVEX_SMOKE_GEMINI_MODEL: gemini-3.8-flash
      ZHIVEX_SMOKE_VERTEX_MODEL: gemini-3.8-flash
      ZHIVEX_SMOKE_QWEN_MODEL: qwen3.8-max-0902
      ZHIVEX_SMOKE_KIMI_MODEL: kimi-k3
      ZHIVEX_SMOKE_DEEPSEEK_MODEL: deepseek-v4-flash
      ZHIVEX_SMOKE_META_MODEL: muse-spark-1.2
      ZHIVEX_SMOKE_VLLM_MODEL: ${{ vars.ZHIVEX_CERT_VLLM_MODEL }}
      ZHIVEX_SMOKE_VLLM_BASE_URL: ${{ secrets.ZHIVEX_CERT_VLLM_BASE_URL }}
      VERTEX_LOCATION: ${{ vars.ZHIVEX_CERT_VERTEX_LOCATION || 'us-central1' }}
      GOOGLE_CLOUD_PROJECT: ${{ vars.ZHIVEX_CERT_GOOGLE_CLOUD_PROJECT }}
      OPENAI_API_KEY: ${{ secrets.ZHIVEX_CERT_OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ZHIVEX_CERT_ANTHROPIC_API_KEY }}
      AZURE_OPENAI_API_KEY: ${{ secrets.ZHIVEX_CERT_AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_ENDPOINT: ${{ secrets.ZHIVEX_CERT_AZURE_OPENAI_ENDPOINT }}
      GOOGLE_API_KEY: ${{ secrets.ZHIVEX_CERT_GOOGLE_API_KEY }}
      VERTEX_ACCESS_TOKEN: ${{ secrets.ZHIVEX_CERT_VERTEX_ACCESS_TOKEN }}
      QWEN_API_KEY: ${{ secrets.ZHIVEX_CERT_QWEN_API_KEY }}
      MOONSHOT_API_KEY: ${{ secrets.ZHIVEX_CERT_MOONSHOT_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.ZHIVEX_CERT_DEEPSEEK_API_KEY }}
      MODEL_API_KEY: ${{ secrets.ZHIVEX_CERT_MODEL_API_KEY }}
      VLLM_API_KEY: ${{ secrets.ZHIVEX_CERT_VLLM_API_KEY }}

    steps:
      - name: Check out certification controls
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"

      - name: Build the checkout wheel
        run: uv build

      - name: Install the checkout wheel
        run: |
          uv venv /tmp/cert
          uv pip install --python /tmp/cert/bin/python dist/zhivex_ai_sdk-*-py3-none-any.whl

      - name: Write checkout certification policy
        id: target
        shell: bash
        run: |
          /tmp/cert/bin/python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          provider = os.environ["ZHIVEX_SMOKE_PROVIDERS"]
          profile = os.environ.get("ZHIVEX_SMOKE_PROFILE") or "full"
          wheels = sorted(Path("dist").glob("zhivex_ai_sdk-*-py3-none-any.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected one wheel, found {wheels}")
          wheel = wheels[0]
          version = wheel.name.removeprefix("zhivex_ai_sdk-").removesuffix("-py3-none-any.whl")
          digest = hashlib.sha256(wheel.read_bytes()).hexdigest()
          revision = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          policy = json.loads(Path("docs/provider-certification-policy.json").read_text("utf-8"))
          if provider == "vllm":
              target_id = "vllm-deployment"
          else:
              target_id = f"{provider}-standard"
          targets = {item["id"]: item for item in policy["targets"]}
          if target_id not in targets:
              raise SystemExit(f"unknown target {target_id}")
          target = targets[target_id]
          if profile == "cheap":
              target["required_operations"] = ["generation"]
              target.pop("unsupported_operations", None)
          policy["expected_artifact"] = {
              "package_version": version,
              "source_revision": revision,
              "sha256": digest,
          }
          policy["evidence_files"] = ["dist/checkout-certification.json"]
          Path("dist").mkdir(exist_ok=True)
          Path("dist/checkout-certification-policy.json").write_text(
              json.dumps(policy, indent=2) + "\n", "utf-8"
          )
          requirement = {
              "operations": list(target["required_operations"]),
          }
          unsupported = target.get("unsupported_operations") or []
          if unsupported and profile != "cheap":
              requirement["unsupported_operations"] = list(unsupported)
          expected_model = target.get("expected_model")
          if isinstance(expected_model, str) and expected_model:
              requirement["model"] = expected_model
          smoke = {
              "schema_version": 1,
              "package_version": version,
              "artifact_sha256": digest,
              "require_artifact_sha256": True,
              "require_installed_package": True,
              "source_revision": revision,
              "required_providers": {provider: requirement},
          }
          Path("dist/checkout-smoke-policy.json").write_text(
              json.dumps(smoke, indent=2) + "\n", "utf-8"
          )
          env_path = Path(os.environ["GITHUB_ENV"])
          extra_env = (
              "ZHIVEX_RELEASE_SMOKE_POLICY=dist/checkout-smoke-policy.json\n"
              + f"ZHIVEX_SMOKE_ARTIFACT_PATH={wheel.as_posix()}\n"
              + "ZHIVEX_SMOKE_EVIDENCE_PATH=dist/checkout-certification.json\n"
          )
          if profile == "cheap":
              extra_env += "ZHIVEX_SMOKE_AGENTS=0\nZHIVEX_SMOKE_PORTABLE_CERTIFICATION=0\n"
          env_path.write_text(env_path.read_text("utf-8") + extra_env, "utf-8")
          output = Path(os.environ["GITHUB_OUTPUT"])
          output.write_text(
              output.read_text("utf-8") + f"target_id={target_id}\n",
              "utf-8",
          )
          PY

      - name: Run bounded checkout certification
        run: /tmp/cert/bin/python scripts/run_live_smoke.py

      - name: Validate successful certification evidence
        if: ${{ always() }}
        run: >-
          /tmp/cert/bin/python scripts/verify_provider_certification.py
          --policy dist/checkout-certification-policy.json
          --evidence dist/checkout-certification.json
          --check-schema
          --require-target "${{ steps.target.outputs.target_id }}"
          --report provider-certification-report.json

      - name: Upload retained evidence or blocker
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tier1-${{ inputs.provider }}-certification
          path: |
            dist/checkout-certification.json
            provider-certification-report.json
          if-no-files-found: warn
          retention-days: 30
