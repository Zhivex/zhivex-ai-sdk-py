name: Tier-1 provider certification

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Tier-1 target to certify from the exact 0.23.0 wheel
        required: true
        type: choice
        options:
          - openai
          - anthropic
          - azure-openai
          - gemini
          - vertex
          - qwen
          - kimi
          - deepseek
          - meta
          - vllm

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: provider-certification
    env:
      ZHIVEX_SMOKE_USE_INSTALLED: "1"
      ZHIVEX_SMOKE_STRICT: "1"
      ZHIVEX_SMOKE_AGENTS: "1"
      ZHIVEX_SMOKE_PORTABLE_CERTIFICATION: "1"
      ZHIVEX_SMOKE_META_CERTIFICATION: "1"
      ZHIVEX_SMOKE_SANITIZED_DIAGNOSTICS: "1"
      ZHIVEX_SMOKE_PROVIDERS: ${{ inputs.provider }}
      ZHIVEX_SMOKE_ARTIFACT_PATH: dist/zhivex_ai_sdk-0.23.0-py3-none-any.whl
      ZHIVEX_SMOKE_OPENAI_MODEL: gpt-5.6-luna
      ZHIVEX_SMOKE_ANTHROPIC_MODEL: claude-fable-5-1
      ZHIVEX_SMOKE_AZURE_OPENAI_MODEL: ${{ vars.ZHIVEX_CERT_AZURE_OPENAI_MODEL }}
      ZHIVEX_SMOKE_GEMINI_MODEL: gemini-3.8-flash
      ZHIVEX_SMOKE_VERTEX_MODEL: gemini-3.8-flash
      ZHIVEX_SMOKE_QWEN_MODEL: qwen3.8-max-0902
      ZHIVEX_SMOKE_KIMI_MODEL: kimi-k3
      ZHIVEX_SMOKE_DEEPSEEK_MODEL: deepseek-v4-flash
      ZHIVEX_SMOKE_META_MODEL: muse-spark-1.2
      ZHIVEX_SMOKE_VLLM_MODEL: ${{ vars.ZHIVEX_CERT_VLLM_MODEL }}
      ZHIVEX_SMOKE_VLLM_BASE_URL: ${{ secrets.ZHIVEX_CERT_VLLM_BASE_URL }}
      VERTEX_LOCATION: ${{ vars.ZHIVEX_CERT_VERTEX_LOCATION || 'us-central1' }}
      GOOGLE_CLOUD_PROJECT: ${{ vars.ZHIVEX_CERT_GOOGLE_CLOUD_PROJECT }}
      OPENAI_API_KEY: ${{ secrets.ZHIVEX_CERT_OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ZHIVEX_CERT_ANTHROPIC_API_KEY }}
      AZURE_OPENAI_API_KEY: ${{ secrets.ZHIVEX_CERT_AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_ENDPOINT: ${{ secrets.ZHIVEX_CERT_AZURE_OPENAI_ENDPOINT }}
      GOOGLE_API_KEY: ${{ secrets.ZHIVEX_CERT_GOOGLE_API_KEY }}
      VERTEX_ACCESS_TOKEN: ${{ secrets.ZHIVEX_CERT_VERTEX_ACCESS_TOKEN }}
      QWEN_API_KEY: ${{ secrets.ZHIVEX_CERT_QWEN_API_KEY }}
      MOONSHOT_API_KEY: ${{ secrets.ZHIVEX_CERT_MOONSHOT_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.ZHIVEX_CERT_DEEPSEEK_API_KEY }}
      MODEL_API_KEY: ${{ secrets.ZHIVEX_CERT_MODEL_API_KEY }}
      VLLM_API_KEY: ${{ secrets.ZHIVEX_CERT_VLLM_API_KEY }}

    steps:
      - name: Check out certification controls
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Select the reviewed target policy
        id: target
        shell: bash
        run: |
          case "$ZHIVEX_SMOKE_PROVIDERS" in
            qwen|kimi|deepseek|meta|vllm) cohort="hu8" ;;
            openai|anthropic|azure-openai|gemini|vertex) cohort="hu7" ;;
            *) exit 2 ;;
          esac
          case "$ZHIVEX_SMOKE_PROVIDERS" in
            vllm) target_id="vllm-deployment" ;;
            *) target_id="${ZHIVEX_SMOKE_PROVIDERS}-standard" ;;
          esac
          policy="docs/releases/0.23.0-${cohort}-${ZHIVEX_SMOKE_PROVIDERS}-smoke-policy.json"
          evidence="docs/releases/0.23.0-${cohort}-${ZHIVEX_SMOKE_PROVIDERS}-certification.json"
          test -f "$policy"
          rm -f "$evidence"
          echo "ZHIVEX_RELEASE_SMOKE_POLICY=$policy" >> "$GITHUB_ENV"
          echo "ZHIVEX_SMOKE_EVIDENCE_PATH=$evidence" >> "$GITHUB_ENV"
          echo "target_id=$target_id" >> "$GITHUB_OUTPUT"
          echo "evidence=$evidence" >> "$GITHUB_OUTPUT"

      - name: Download the exact published wheel
        run: >-
          python -m pip download --disable-pip-version-check --no-deps --only-binary=:all:
          zhivex-ai-sdk==0.23.0 -d dist

      - name: Verify and install the exact wheel
        run: |
          python -c 'import hashlib, pathlib; p=pathlib.Path("dist/zhivex_ai_sdk-0.23.0-py3-none-any.whl"); expected="ccf02e9727edbfbd9bb4019efcfe646b21c31e97d384037ed24b723e1662a464"; observed=hashlib.sha256(p.read_bytes()).hexdigest(); assert observed == expected, "wheel SHA256 mismatch"'
          python -m pip install --disable-pip-version-check dist/zhivex_ai_sdk-0.23.0-py3-none-any.whl

      - name: Run bounded exact-artifact certification
        run: python scripts/run_live_smoke.py

      - name: Validate successful certification evidence
        if: ${{ always() }}
        run: >-
          python scripts/verify_provider_certification.py
          --evidence "${{ steps.target.outputs.evidence }}"
          --check-schema
          --require-target "${{ steps.target.outputs.target_id }}"
          --report provider-certification-report.json

      - name: Upload retained evidence or blocker
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tier1-${{ inputs.provider }}-certification
          path: |
            ${{ steps.target.outputs.evidence }}
            provider-certification-report.json
          if-no-files-found: warn
          retention-days: 30
