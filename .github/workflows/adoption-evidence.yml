name: Adoption evidence
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
      ZHIVEX_TEST_POSTGRES_DSN: postgresql://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.12.4'
      - run: uv sync --locked --all-extras
      - run: .venv/bin/python -m build --wheel --no-isolation
      - name: Installed SQLite consumer
        run: .venv/bin/python scripts/verify_adoption.py dist/*.whl --output evidence/adoption-sqlite.json
      - name: Installed Postgres consumer
        run: .venv/bin/python scripts/verify_adoption.py dist/*.whl --backend postgres --output evidence/adoption-postgres.json
      - name: Prepare independent consumer
        run: |
          python -m venv /tmp/consumer
          uv pip install --python /tmp/consumer/bin/python "$(realpath dist/*.whl)[postgres,otel]" opentelemetry-exporter-otlp-proto-http==1.44.0 ruff==0.16.6 mypy==2.3.1
      - name: Generated project checks
        working-directory: /tmp
        run: |
          /tmp/consumer/bin/python -I -m zhivex_ai.cli init generated
          /tmp/consumer/bin/python -m ruff check generated/app.py generated/test_app.py
          /tmp/consumer/bin/python -m mypy generated/app.py generated/test_app.py
      - name: Benchmarks and bounded Postgres soak
        run: /tmp/consumer/bin/python -I benchmarks/run.py --budget benchmarks/budgets.json --wheel dist/*.whl --commit "$GITHUB_SHA" --require-postgres --output evidence/performance.json
      - name: Start OTLP backends
        run: docker compose -p zhivex-observability -f examples/observability/compose.yaml up -d
      - name: Export and verify this trace
        env:
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://127.0.0.1:14318/v1/traces
        run: |
          sleep 10
          /tmp/consumer/bin/python -I examples/observability/otlp_recipe.py > /tmp/trace-receipt.json
          .venv/bin/python scripts/verify_otlp.py --receipt /tmp/trace-receipt.json --output evidence/otlp.json
      - name: Stop disposable backends
        if: always()
        run: docker compose -p zhivex-observability -f examples/observability/compose.yaml down
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: adoption-evidence
          path: evidence/
