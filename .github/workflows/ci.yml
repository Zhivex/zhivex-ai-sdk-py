name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and project
        run: python -m pip install --upgrade pip build hatchling -e ".[dev,postgres,mcp]"

      - name: Compile sources
        run: python -m compileall src tests examples

      - name: Check generated support matrix
        run: python scripts/generate_support_matrix.py --check-readme

      - name: Run Ruff
        run: python -m ruff check src tests examples

      - name: Run Mypy
        run: python -m mypy

  test:
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: zhivex
          POSTGRES_USER: zhivex
          POSTGRES_PASSWORD: zhivex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zhivex -d zhivex"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ZHIVEX_TEST_POSTGRES_DSN: postgres://zhivex:zhivex@127.0.0.1:5432/zhivex

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies and project
        run: python -m pip install --upgrade pip build hatchling -e ".[dev,postgres,mcp]"

      - name: Run tests with coverage
        if: matrix.python-version == '3.11'
        run: python -m pytest --cov=src/zhivex_ai --cov-report=term-missing:skip-covered --cov-fail-under=80 -q

      - name: Run tests
        if: matrix.python-version != '3.11'
        run: python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and project
        run: python -m pip install --upgrade pip build hatchling twine -e ".[dev]"

      - name: Build distributions
        run: python -m build --no-isolation

      - name: Check distributions
        run: python -m twine check dist/*
