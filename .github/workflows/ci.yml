name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: zhivex
          POSTGRES_USER: zhivex
          POSTGRES_PASSWORD: zhivex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zhivex -d zhivex"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ZHIVEX_TEST_POSTGRES_DSN: postgres://zhivex:zhivex@127.0.0.1:5432/zhivex

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies and project
        run: python -m pip install --upgrade pip build hatchling -e ".[dev,postgres,mcp]"

      - name: Compile sources
        run: python -m compileall src tests examples

      - name: Run tests
        run: python -m pytest -q

      - name: Build distributions
        run: python -m build
