name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"

      - name: Install dependencies and project
        run: uv sync --locked --all-extras --python 3.11

      - name: Run dependency security gates
        run: uv run --no-sync make PYTHON=python security-check

      - name: Compile sources
        run: uv run --no-sync python -m compileall src tests examples

      - name: Validate provider certification evidence
        run: uv run --no-sync python scripts/verify_provider_certification.py --check-schema

      - name: Check generated provider documentation
        run: uv run --no-sync python scripts/generate_support_matrix.py --check-docs

      - name: Run Ruff
        run: uv run --no-sync make PYTHON=python lint

      - name: Run Mypy
        run: uv run --no-sync python -m mypy

  test:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: zhivex
          POSTGRES_USER: zhivex
          POSTGRES_PASSWORD: zhivex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zhivex -d zhivex"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ZHIVEX_TEST_POSTGRES_DSN: postgres://zhivex:zhivex@127.0.0.1:5432/zhivex

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"

      - name: Install dependencies and project
        run: uv sync --locked --all-extras --python "${{ matrix.python-version }}"

      - name: Verify production-hardening contracts
        run: uv run --no-sync python -m pytest tests/test_agent_evaluation.py tests/test_cli.py tests/test_protocols.py tests/test_responses_host.py tests/test_workflow_graph.py tests/test_workflow_state.py -q

      - name: Run tests with coverage
        if: matrix.python-version == '3.11'
        run: uv run --no-sync python -m pytest --cov=src/zhivex_ai --cov-report=term-missing:skip-covered --cov-fail-under=80 -q

      - name: Run tests
        if: matrix.python-version != '3.11'
        run: uv run --no-sync python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: zhivex
          POSTGRES_USER: zhivex
          POSTGRES_PASSWORD: zhivex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zhivex -d zhivex"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ZHIVEX_TEST_POSTGRES_DSN: postgres://zhivex:zhivex@127.0.0.1:5432/zhivex

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"

      - name: Install build tools and project
        run: uv sync --locked --all-extras --python 3.11

      - name: Build distributions
        run: uv run --no-sync python -m build --no-isolation

      - name: Check distributions
        run: uv run --no-sync python -m twine check dist/*

      - name: Verify release artifacts
        run: uv run --no-sync python scripts/verify_release_artifacts.py --dist-dir dist --require-postgres-workflow-smoke

  dependency-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [minimum-core, minimum-extras, latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"

      - name: Install locked orchestration tools
        run: uv sync --locked --extra dev --python 3.11
      - name: Test declared dependency ranges
        run: uv run --no-sync python scripts/check_dependency_compatibility.py --mode "${{ matrix.mode }}" --report "dist/dependencies-${{ matrix.mode }}.json"
      - name: Retain dependency versions and result
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependencies-${{ matrix.mode }}
          path: dist/dependencies-${{ matrix.mode }}.json
          retention-days: 30
