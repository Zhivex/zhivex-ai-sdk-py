name: Vertex exact-wheel integration

on:
  workflow_dispatch:
    inputs:
      target:
        description: Reviewed baseline target (all includes paid audio/video generation)
        required: true
        default: gemini-core
        type: choice
        options:
          - all
          - gemini-core
          - gemini-cache
          - gemini-pro
          - gemini-pro-customtools
          - gemini-lite
          - gemma
          - gpt-oss-120b
          - mistral-medium
          - mistral-small
          - codestral
          - codestral-fim
          - mistral-ocr
          - gemini-hosted
          - gemini-pro-hosted
          - gemini-pro-customtools-hosted
          - gemini-multimodal
          - gemini-pro-multimodal
          - gemini-pro-customtools-multimodal
          - gemini-video-input
          - gemini-pro-video-input
          - gemini-pro-customtools-video-input
          - transcribe
          - transcribe-live
          - translate-live
          - omni-video
          - image-pro
          - image-pro-edit
          - image-flash
          - image-flash-edit
          - image-lite
          - image-lite-edit
          - embedding-2
          - live-audio

permissions:
  contents: read

concurrency:
  group: vertex-integration
  cancel-in-progress: false

jobs:
  integrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: provider-certification
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
      - name: Build candidate from the reviewed revision
        run: |
          uv sync --locked --all-extras --python 3.12
          uv build --wheel --no-build-isolation
      - name: Install candidate outside the checkout
        shell: bash
        run: |
          uv venv /tmp/vertex-integration --python 3.12
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          echo "VERTEX_WHEEL=${wheels[0]}" >> "$GITHUB_ENV"
          uv pip install --python /tmp/vertex-integration/bin/python "${wheels[0]}[vertex,realtime]" python-dotenv
      - name: Configure protected ADC
        env:
          CREDENTIALS_JSON: ${{ secrets.ZHIVEX_CERT_GOOGLE_CREDENTIALS_JSON }}
          CERT_PROJECT: ${{ vars.ZHIVEX_CERT_GOOGLE_CLOUD_PROJECT }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          raw = os.environ.get("CREDENTIALS_JSON", "")
          if not raw or not os.environ.get("CERT_PROJECT"):
              raise SystemExit("Configure the protected ADC credential and project before dispatch.")
          config = json.loads(raw)
          if config.get("type") not in {"service_account", "external_account"}:
              raise SystemExit("CI requires service-account or workload-federated credentials.")
          path = Path(os.environ["RUNNER_TEMP"]) / "vertex-adc.json"
          with path.open("x", opener=lambda p, flags: os.open(p, flags, 0o600)) as handle:
              handle.write(raw)
          with open(os.environ["GITHUB_ENV"], "a") as handle:
              handle.write(f"GOOGLE_APPLICATION_CREDENTIALS={path}\n")
          PY
      - name: Execute targets sequentially
        env:
          CERT_TARGET: ${{ inputs.target }}
          CERT_PROJECT: ${{ vars.ZHIVEX_CERT_GOOGLE_CLOUD_PROJECT }}
        shell: bash
        run: |
          args=()
          if [ "$CERT_TARGET" != "all" ]; then args=(--target "$CERT_TARGET"); fi
          /tmp/vertex-integration/bin/python scripts/run_vertex_matrix.py \
            --wheel "$VERTEX_WHEEL" --project "$CERT_PROJECT" \
            --output-dir vertex-evidence "${args[@]}"
      - name: Remove temporary credentials
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/vertex-adc.json"
      - name: Retain candidate and integration evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vertex-integration-${{ github.run_id }}
          path: |
            dist/*.whl
            vertex-evidence/*.json
          if-no-files-found: warn
          retention-days: 30
