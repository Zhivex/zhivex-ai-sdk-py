[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "zhivex-ai-sdk"
version = "0.23.0"
description = "Provider-portable Python runtime for building reliable AI agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["ai", "agent", "agents", "llm", "sdk", "multi-provider", "tools", "durable-execution"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
authors = [
  { name = "Zhivex" }
]
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.8.0"
]

[project.optional-dependencies]
docs = [
  "mkdocs>=1.6.1,<2"
]
realtime = [
  "websockets>=15.0.1"
]
dev = [
  "httpx2>=2.12.0",
  "build>=1.2.0",
  "click>=8.3.3",
  "cryptography>=50.0.0",
  "hatchling>=1.27.0",
  "mypy>=1.10.0",
  "pip-audit>=2.10.1",
  "python-docx>=1.1.0",
  "python-dotenv>=1.2.2",
  "pytest>=9.0.3",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "setuptools>=83.0.0",
  "twine>=5.1.0"
]
postgres = [
  "asyncpg>=0.29.0"
]
mcp = [
  "click>=8.3.3",
  "cryptography>=50.0.0",
  "mcp>=1.28.1"
]
docx = [
  "python-docx>=1.1.0"
]
api = [
  "click>=8.3.3",
  "fastapi>=0.115.0",
  "uvicorn>=0.31.0"
]
a2a = [
  "a2a-sdk[fastapi]>=1.1.2,<2",
  "cryptography>=50.0.0",
  "uvicorn>=0.31.0"
]
ag-ui = [
  "ag-ui-protocol>=0.1.19,<0.2"
]
otel = [
  "opentelemetry-api>=1.28.0",
  "opentelemetry-sdk>=1.28.0"
]

[project.urls]
Homepage = "https://github.com/Zhivex/zhivex-ai-sdk-py"
Repository = "https://github.com/Zhivex/zhivex-ai-sdk-py"
Issues = "https://github.com/Zhivex/zhivex-ai-sdk-py/issues"

[project.scripts]
zhivex = "zhivex_ai.cli:main"
zhivex-skills = "zhivex_ai.skill_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zhivex_ai"]

[tool.hatch.build.targets.wheel.force-include]
"src/zhivex_ai/py.typed" = "zhivex_ai/py.typed"
"src/zhivex_ai/__init__.pyi" = "zhivex_ai/__init__.pyi"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/examples",
  "/docs",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/PRODUCTION_APIS.md",
  "/README.md",
  "/SECURITY.md",
  "/STABILITY.md",
  "/SUPPORT.md",
  "/VERSIONING.md",
  "/.env.example",
  "/pyproject.toml"
]

[tool.hatch.build.targets.sdist.force-include]
".env.example" = ".env.example"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error:Using .httpx. with .starlette.testclient. is deprecated"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
"examples/**/*.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
files = [
  "src/zhivex_ai/__init__.py",
  "src/zhivex_ai/_serde.py",
  "src/zhivex_ai/_http.py",
  "src/zhivex_ai/_sse.py",
  "src/zhivex_ai/_streaming.py",
  "src/zhivex_ai/_agent_persistence.py",
  "src/zhivex_ai/catalog.py",
  "src/zhivex_ai/embed.py",
  "src/zhivex_ai/api_stability.py",
  "src/zhivex_ai/agent.py",
  "src/zhivex_ai/agent_evaluation.py",
  "src/zhivex_ai/agent_state.py",
  "src/zhivex_ai/cli.py",
  "src/zhivex_ai/evals.py",
  "src/zhivex_ai/errors.py",
  "src/zhivex_ai/experimental/__init__.py",
  "src/zhivex_ai/experimental/providers.py",
  "src/zhivex_ai/experimental/realtime.py",
  "src/zhivex_ai/gateway.py",
  "src/zhivex_ai/generate_object.py",
  "src/zhivex_ai/generate_text.py",
  "src/zhivex_ai/middleware.py",
  "src/zhivex_ai/messages.py",
  "src/zhivex_ai/integrations/__init__.py",
  "src/zhivex_ai/integrations/protocols.py",
  "src/zhivex_ai/integrations/responses.py",
  "src/zhivex_ai/protocols.py",
  "src/zhivex_ai/observability.py",
  "src/zhivex_ai/realtime.py",
  "src/zhivex_ai/responses_host.py",
  "src/zhivex_ai/runtime.py",
  "src/zhivex_ai/safety.py",
  "src/zhivex_ai/schema.py",
  "src/zhivex_ai/skillpacks.py",
  "src/zhivex_ai/skills.py",
  "src/zhivex_ai/transport.py",
  "src/zhivex_ai/types.py",
  "src/zhivex_ai/workflow.py",
  "src/zhivex_ai/workflow_adapters.py",
  "src/zhivex_ai/workflow_graph.py",
  "src/zhivex_ai/workflow_state.py",
  "src/zhivex_ai/workflows.py",
  "src/zhivex_ai/providers/anthropic.py",
  "src/zhivex_ai/providers/azure_openai.py",
  "src/zhivex_ai/providers/base.py",
  "src/zhivex_ai/providers/deepseek.py",
  "src/zhivex_ai/providers/gemini.py",
  "src/zhivex_ai/providers/kimi.py",
  "src/zhivex_ai/providers/meta.py",
  "src/zhivex_ai/providers/openai.py",
  "src/zhivex_ai/providers/openai_compat.py",
  "src/zhivex_ai/providers/_payload.py",
  "src/zhivex_ai/providers/_url_security.py",
  "src/zhivex_ai/providers/bedrock.py",
  "src/zhivex_ai/providers/ollama.py",
  "src/zhivex_ai/providers/openrouter.py",
  "src/zhivex_ai/providers/qwen.py",
  "src/zhivex_ai/providers/vertex.py",
  "src/zhivex_ai/providers/vllm.py",
  "tests/typecheck_agent_dx.py",
  "tests/typecheck_public_api.py",
  "tests/typecheck_workflows.py",
]
check_untyped_defs = true
disallow_untyped_defs = false
warn_return_any = false
warn_unused_configs = true

[tool.uv]
required-version = ">=0.12.4"
