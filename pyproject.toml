[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "zhivex-ai-sdk"
version = "0.4.0"
description = "Agent-first Python SDK for building orchestrated AI systems across multiple providers"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["ai", "agent", "agents", "llm", "sdk", "multi-agent", "tools", "orchestration"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
authors = [
  { name = "Miguel Ortiz" }
]
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "websockets>=15.0.1"
]

[project.optional-dependencies]
dev = [
  "build>=1.2.0",
  "hatchling>=1.27.0",
  "python-dotenv>=1.0.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "twine>=5.1.0"
]
postgres = [
  "asyncpg>=0.29.0"
]
mcp = [
  "mcp>=1.0.0"
]

[project.urls]
Homepage = "https://github.com/Zhivex/zhivex-ai-sdk-py"
Repository = "https://github.com/Zhivex/zhivex-ai-sdk-py"
Issues = "https://github.com/Zhivex/zhivex-ai-sdk-py/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/zhivex_ai"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/examples",
  "/README.md",
  "/pyproject.toml"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
